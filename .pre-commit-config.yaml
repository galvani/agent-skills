# Local parity with .github/workflows/validate.yml. Run `pre-commit install` once per clone.
repos:
  - repo: https://github.com/agent-ecosystem/skill-validator
    rev: v1.8.0
    hooks:
      - id: skill-validator
        args: [check, --strict, --allow-extra-frontmatter, skills/]
        files: ^skills/

  - repo: local
    hooks:
      - id: check-skills
        name: repo rules (layout, links, marketplace, personal data)
        entry: python3 scripts/check_skills.py
        language: system
        pass_filenames: false
        files: ^(skills/|docs/|scripts/|\.claude-plugin/|README\.md|CONTRIBUTING\.md|AGENTS\.md)

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
